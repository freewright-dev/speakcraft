[package]
name = "speakcraft"
version = "0.1.0"
edition = "2024"
description = "Windows hotkey dictation in Rust"
license = "MIT"

[features]
# End-to-end testing only: SPEAKCRAFT_TEST_AUDIO=<16-bit WAV> replaces the microphone.
test-audio = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
cpal = "0.15"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(windows)'.dev-dependencies]
egui_kittest = { version = "0.33", default-features = false, features = ["eframe"] }

[profile.release]
lto = "thin"
strip = true
